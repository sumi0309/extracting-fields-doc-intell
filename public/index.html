<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Doc Intelligence Field Extractor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Automatic Field Extraction</h1>

    <section>
      <h2>1. Upload document</h2>
      <p>The document type is detected automatically, and the fields to extract are chosen based on that type.</p>
      <input type="file" id="fileInput" accept="application/pdf" />
      <button id="submitBtn">Process Document</button>
    </section>

    <section>
      <h2>2. Results</h2>
      <div id="output">Awaiting processing...</div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
